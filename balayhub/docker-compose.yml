# Local production-like stack: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: balayhub
      POSTGRES_PASSWORD: balayhub
      POSTGRES_DB: balayhub
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balayhub"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://balayhub:balayhub@db:5432/balayhub
      APP_URL: http://localhost:3000
      # Without SMTP, accounts can't be verified in production mode.
      # Set SMTP_URL for real use; this flag is only for a local trial.
      REQUIRE_EMAIL_VERIFICATION: "false"
    ports: ["3000:3000"]
    volumes: [uploads:/data/storage]
volumes:
  pgdata:
  uploads:
