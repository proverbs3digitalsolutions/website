<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A bright condo living room with a view of the bay at sunset">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c99a"/>
      <stop offset=".55" stop-color="#f9dfc0"/>
      <stop offset="1" stop-color="#fbeee0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc3c9"/>
      <stop offset="1" stop-color="#6fa3ad"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4ece1"/>
      <stop offset="1" stop-color="#ead9c4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b48a"/>
      <stop offset="1" stop-color="#c49b6e"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fae98"/>
      <stop offset="1" stop-color="#7f9078"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff6e8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".6" stop-color="#ffd9a0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="800" height="1000" fill="url(#wall)"/>
  <rect y="760" width="800" height="240" fill="url(#floor)"/>
  <g stroke="#c08f60" stroke-opacity=".35" stroke-width="2">
    <line x1="0" y1="800" x2="800" y2="800"/><line x1="0" y1="850" x2="800" y2="850"/>
    <line x1="0" y1="910" x2="800" y2="910"/><line x1="0" y1="975" x2="800" y2="975"/>
  </g>

  <!-- window with bay view -->
  <rect x="300" y="90" width="460" height="640" rx="4" fill="url(#sky)"/>
  <circle cx="560" cy="430" r="120" fill="url(#sun)"/>
  <circle cx="560" cy="430" r="34" fill="#fff1d2"/>
  <g fill="#c9a98f" opacity=".85">
    <rect x="320" y="440" width="26" height="80"/><rect x="350" y="410" width="20" height="110"/>
    <rect x="374" y="455" width="30" height="65"/><rect x="410" y="395" width="18" height="125"/>
    <rect x="432" y="430" width="34" height="90"/><rect x="640" y="445" width="24" height="75"/>
    <rect x="668" y="420" width="18" height="100"/><rect x="690" y="460" width="40" height="60"/>
  </g>
  <rect x="300" y="520" width="460" height="210" fill="url(#sea)"/>
  <g stroke="#fff4e0" stroke-opacity=".7" stroke-width="3" stroke-linecap="round">
    <line x1="520" y1="545" x2="600" y2="545"/><line x1="500" y1="575" x2="620" y2="575"/>
    <line x1="530" y1="610" x2="590" y2="610"/><line x1="380" y1="640" x2="430" y2="640"/>
    <line x1="660" y1="660" x2="720" y2="660"/>
  </g>
  <path d="M300 520 q60 -30 130 -8 q40 12 90 4 v4 h-220z" fill="#a7b9a0" opacity=".8"/>
  <!-- mullions -->
  <g fill="#f7f1e8">
    <rect x="292" y="82" width="476" height="12"/><rect x="292" y="726" width="476" height="14"/>
    <rect x="292" y="82" width="12" height="658"/><rect x="756" y="82" width="12" height="658"/>
    <rect x="525" y="82" width="10" height="658"/>
  </g>
  <!-- sheer curtains -->
  <path d="M250 70 h70 c-8 120 10 240 0 360 c-8 120 12 240 0 330 h-70z" fill="#fffaf2" opacity=".85"/>
  <path d="M262 70 c6 200 -6 420 6 690" stroke="#eadfcf" stroke-width="3" fill="none"/>
  <path d="M290 70 c-6 220 8 450 -2 690" stroke="#eadfcf" stroke-width="3" fill="none"/>
  <!-- sunlight on the floor -->
  <path d="M300 760 L760 760 L640 1000 L120 1000 Z" fill="url(#light)"/>

  <!-- floor lamp -->
  <line x1="222" y1="380" x2="222" y2="760" stroke="#3b3b3b" stroke-width="5"/>
  <ellipse cx="222" cy="762" rx="30" ry="7" fill="#3b3b3b"/>
  <path d="M184 330 h76 l-12 58 h-52z" fill="#f2e3cc"/>
  <ellipse cx="222" cy="390" rx="36" ry="9" fill="#fff4d8" opacity=".6"/>

  <!-- rug -->
  <ellipse cx="420" cy="880" rx="330" ry="70" fill="#efe4d4"/>
  <ellipse cx="420" cy="880" rx="300" ry="58" fill="none" stroke="#d9c7ae" stroke-width="3"/>

  <!-- sofa -->
  <rect x="40" y="610" width="430" height="120" rx="26" fill="url(#sofa)"/>
  <rect x="58" y="560" width="394" height="110" rx="28" fill="#a9b7a2"/>
  <rect x="20" y="600" width="70" height="150" rx="26" fill="#8d9d86"/>
  <rect x="420" y="600" width="70" height="150" rx="26" fill="#8d9d86"/>
  <rect x="90" y="660" width="160" height="60" rx="16" fill="#b4c1ad"/>
  <rect x="262" y="660" width="160" height="60" rx="16" fill="#b4c1ad"/>
  <rect x="44" y="746" width="10" height="26" rx="3" fill="#6b5640"/>
  <rect x="456" y="746" width="10" height="26" rx="3" fill="#6b5640"/>
  <!-- pillows -->
  <rect x="96" y="590" width="92" height="78" rx="18" fill="#d9774a" transform="rotate(-8 142 629)"/>
  <rect x="330" y="592" width="86" height="74" rx="18" fill="#efd9b8" transform="rotate(7 373 629)"/>
  <path d="M342 600 l60 56 M402 600 l-60 56" stroke="#e2c79f" stroke-width="4"/>
  <!-- throw blanket -->
  <path d="M380 650 q40 10 60 0 l18 100 q-40 14 -80 4z" fill="#2f3a34"/>

  <!-- coffee table -->
  <ellipse cx="560" cy="808" rx="150" ry="30" fill="#b88653"/>
  <ellipse cx="560" cy="800" rx="150" ry="28" fill="#cd9b66"/>
  <rect x="470" y="806" width="10" height="70" fill="#8f6438"/>
  <rect x="640" y="806" width="10" height="70" fill="#8f6438"/>
  <rect x="520" y="776" width="60" height="10" rx="3" fill="#2f3a34"/>
  <rect x="524" y="768" width="52" height="9" rx="3" fill="#e8dccb"/>
  <path d="M600 790 q8 -22 26 -22 q18 0 22 22z" fill="#f4efe6"/>

  <!-- monstera plant -->
  <path d="M680 760 h70 l-10 70 h-50z" fill="#5c4a3a"/>
  <g fill="#3f7a5a">
    <path d="M714 760 c-60 -40 -90 -120 -40 -170 c20 60 40 110 40 170z"/>
    <path d="M714 760 c40 -60 90 -110 60 -190 c-40 50 -60 120 -60 190z" fill="#4d8c69"/>
    <path d="M714 760 c-20 -80 -10 -160 30 -230 c20 70 0 160 -30 230z" fill="#35694c"/>
    <path d="M714 760 c-50 -20 -110 -10 -140 -60 c60 -10 110 20 140 60z" fill="#4d8c69"/>
  </g>

  <!-- wall art -->
  <rect x="34" y="230" width="130" height="164" rx="4" fill="#fbf6ee" stroke="#cfb08a" stroke-width="6"/>
  <path d="M48 368 q34 -78 60 -52 q18 18 42 -26 v78 h-102z" fill="#9fb5a8"/>
  <circle cx="128" cy="274" r="14" fill="#e6a46f"/>
</svg>
